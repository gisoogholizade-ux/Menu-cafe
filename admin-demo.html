<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دموی پنل مدیریت | کافه آکاتسوکی</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f4f4f4;font-family:Vazirmatn,system-ui}.shell{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.top h1{font-size:22px;margin:0}.top p{margin:3px 0 0;color:#888;font-size:11px}.back{color:#e6a9ae;text-decoration:none;font-size:11px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#111;border:1px solid #ffffff12;border-radius:18px;padding:16px}.stat span{display:block;color:#888;font-size:10px}.stat strong{font-size:24px}.toolbar{margin:18px 0 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.toolbar h2{margin:0;font-size:18px}.btn{border:0;background:#a91420;color:#fff;border-radius:12px;padding:10px 14px;font:600 11px Vazirmatn;cursor:pointer}.panel{background:#111;border:1px solid #ffffff12;border-radius:20px;overflow:hidden}.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 12px;border-bottom:1px solid #ffffff0d}.row:last-child{border-bottom:0}.thumb{width:56px;height:56px;border-radius:13px;object-fit:cover}.name{min-width:0}.name strong{display:block;font-size:12px}.name small{display:block;color:#777;font-size:9px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.pill{font-size:8px;padding:4px 6px;border-radius:999px;background:#6d111822;color:#d7a2a6}.actions{display:flex;gap:6px}.icon{width:32px;height:32px;border-radius:10px;border:1px solid #ffffff10;background:#181818;color:#ddd;cursor:pointer}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:end center;padding-top:40px;z-index:20}.modal.open{display:grid}.box{width:min(100%,560px);max-height:90vh;overflow:auto;background:#111;border:1px solid #ffffff12;border-radius:24px 24px 0 0;padding:18px}.box h3{margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr;gap:10px}.field label{display:block;color:#999;font-size:9px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#171717;border:1px solid #ffffff12;border-radius:12px;color:#fff;font:11px Vazirmatn;padding:11px}.field textarea{min-height:80px}.savebar{display:flex;gap:8px;margin-top:14px}.ghost{background:#1b1b1b;color:#ccc}@media(min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.grid{grid-template-columns:1fr 1fr}.box{border-radius:24px;margin:auto;align-self:center}.modal{place-items:center}.row{grid-template-columns:64px minmax(0,1fr) auto}.thumb{width:64px;height:64px}}</style></head><body><main class="shell"><div class="top"><div><h1>پنل مدیریت منو</h1><p>دموی نمایشی برای مدیریت آیتم‌ها و دسته‌بندی‌ها</p></div><a class="back" href="index.html">← برگشت به منو</a></div><section class="stats"><div class="stat"><span>کل آیتم‌ها</span><strong>۱۲</strong></div><div class="stat"><span>موجود</span><strong>۱۱</strong></div><div class="stat"><span>ناموجود</span><strong>۱</strong></div><div class="stat"><span>دسته‌بندی</span><strong>۶</strong></div></section><div class="toolbar"><h2>مدیریت محصولات</h2><button class="btn" id="addBtn">+ افزودن محصول</button></div><section class="panel" id="list"></section></main><div class="modal" id="modal"><div class="box"><h3>افزودن محصول</h3><div class="grid"><div class="field"><label>نام محصول</label><input value="لاته کارامل"></div><div class="field"><label>نام انگلیسی</label><input value="Caramel Latte"></div><div class="field"><label>دسته‌بندی</label><select><option>قهوه گرم</option><option>قهوه سرد</option><option>کیک و دسر</option></select></div><div class="field"><label>قیمت</label><input value="175000"></div><div class="field" style="grid-column:1/-1"><label>توضیحات</label><textarea>اسپرسو، شیر و سس کارامل با بافتی نرم و متعادل.</textarea></div></div><div class="savebar"><button class="btn" id="save">ذخیره تغییرات</button><button class="btn ghost" id="cancel">انصراف</button></div></div></div><script>const data=[['اسپرسو','قهوه گرم','۹۵,۰۰۰','https://images.unsplash.com/photo-1510707577719-ae7c14805e3a?auto=format&fit=crop&w=200&q=80',1],['کاپوچینو','قهوه گرم','۱۴۵,۰۰۰','https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=200&q=80',1],['آیس لاته','قهوه سرد','۱۶۵,۰۰۰','https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=200&q=80',1],['چیزکیک','کیک و دسر','۱۸۵,۰۰۰','https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=200&q=80',1],['براونی','کیک و دسر','۱۴۵,۰۰۰','https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=200&q=80',0]];function render(){list.innerHTML=data.map((x,i)=>`<div class="row"><img class="thumb" src="${x[3]}"><div class="name"><strong>${x[0]}</strong><small>${x[1]} • ${x[2]} تومان</small><div class="meta"><span class="pill">${x[4]?'موجود':'ناموجود'}</span></div></div><div class="actions"><button class="icon" onclick="openM()">✎</button><button class="icon" onclick="toggle(${i})">◉</button></div></div>`).join('')}function openM(){modal.classList.add('open')}function toggle(i){data[i][4]=data[i][4]?0:1;render()}addBtn.onclick=openM;cancel.onclick=()=>modal.classList.remove('open');save.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};render()</script></body></html>
