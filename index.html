<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>کافه آکاتسوکی | منوی دیجیتال</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#080808;--surface:#111;--surface2:#181818;--red:#c1121f;--red2:#e11d2e;--text:#f5f5f5;--muted:#9d9d9d;--border:rgba(255,255,255,.08)}*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;color:var(--text);font-family:Vazirmatn,system-ui;background:radial-gradient(circle at 90% -10%,rgba(193,18,31,.18),transparent 34%),#080808;min-height:100vh;overflow-x:hidden}.wrap{width:min(100%,1160px);margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}.top{padding:8px 0 10px}.brand{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center}.logo{width:54px;height:54px;border-radius:18px;border:1px solid rgba(225,29,46,.22);display:grid;place-items:center;background:linear-gradient(145deg,#181818,#0c0c0c);box-shadow:0 12px 35px #0008}.logo:before{content:"☁";font-size:28px;color:var(--red2);filter:drop-shadow(0 0 8px #8b111a66)}.brand h1{font-size:19px;margin:0}.brand p{margin:3px 0 0;color:#8c8c8c;font-size:11px}.status{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:999px;background:#16312055;border:1px solid #66c78c22;color:#a9d9b9;font-size:10px;white-space:nowrap}.status i{width:7px;height:7px;border-radius:50%;background:#56c77e;box-shadow:0 0 10px #56c77e}.search{position:relative;margin:12px 0}.search input{width:100%;height:50px;background:#111;border:1px solid var(--border);border-radius:16px;color:white;font:inherit;padding:0 44px 0 14px;outline:none}.search span{position:absolute;right:15px;top:50%;transform:translateY(-50%);opacity:.55}.cats{position:sticky;top:0;z-index:10;margin:0 -14px;padding:8px 14px 12px;background:linear-gradient(180deg,#080808fc,#080808e8,#08080800);backdrop-filter:blur(14px)}.catrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.catrow::-webkit-scrollbar{display:none}.chip{border:1px solid var(--border);background:#111;color:#bdbdbd;border-radius:999px;padding:9px 14px;white-space:nowrap;font:600 12px Vazirmatn;cursor:pointer}.chip.active{background:linear-gradient(135deg,#771018,#a91521);color:white;border-color:#d2253244}.head{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 12px}.head h2{margin:0;font-size:20px}.head p{margin:0;color:#777;font-size:11px}.grid{display:grid;grid-template-columns:1fr;gap:11px}.card{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;background:linear-gradient(145deg,#141414,#0e0e0e);border:1px solid var(--border);border-radius:20px;padding:9px;cursor:pointer;transition:.18s;min-width:0}.card:active{transform:scale(.99)}.pic{position:relative;aspect-ratio:1;border-radius:15px;overflow:hidden;background:#161616}.pic img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;right:6px;top:6px;font-size:8px;padding:5px 7px;border-radius:999px;background:#7f1119e8;color:white}.info{min-width:0;padding:3px 1px}.title{display:flex;justify-content:space-between;gap:8px}.title h3{margin:0;font-size:15px}.title small{display:block;color:#666;font-size:9px;direction:ltr;text-align:right}.price{font-size:12px;white-space:nowrap}.desc{color:#9f9f9f;font-size:10.5px;line-height:1.8;margin:7px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:8px;padding:4px 7px;border-radius:999px;color:#dba9ad;background:#86121b22;border:1px solid #c1121f22}.off{opacity:.6}.off img{filter:grayscale(.7)}.demo-link{display:inline-flex;margin-top:20px;color:#e6b3b7;text-decoration:none;font-size:11px;border-bottom:1px dashed #7a242b}.backdrop{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);z-index:40;display:none}.sheet{position:fixed;left:0;right:0;bottom:0;margin:auto;width:min(100%,560px);max-height:88dvh;overflow:auto;background:#111;border:1px solid var(--border);border-radius:26px 26px 0 0;z-index:41;display:none;padding-bottom:calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}.sheet.open,.backdrop.open{display:block}.handle{width:42px;height:4px;border-radius:999px;background:#3a3a3a;margin:9px auto}.sheet img{width:calc(100% - 24px);height:230px;object-fit:cover;margin:0 12px;border-radius:20px}.sheet .body{padding:18px}.sheet h2{margin:0;font-size:24px}.sheet .en{color:#666;font-size:11px;direction:ltr;text-align:right}.sheet .bigdesc{color:#aaa;line-height:1.9;font-size:12px}.sheet .bottom{display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:14px;margin-top:18px}.close{position:absolute;left:18px;top:18px;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:#111c;color:#fff;font-size:22px}@keyframes up{from{transform:translateY(20px);opacity:0}}@media(min-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.wrap{padding-inline:22px}.cats{margin-inline:-22px;padding-inline:22px}}@media(min-width:960px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card:hover{transform:translateY(-3px);border-color:#e11d2e33}}@media(max-width:340px){.brand{grid-template-columns:48px 1fr}.status{grid-column:2;justify-self:start}.card{grid-template-columns:88px minmax(0,1fr);gap:9px}.title{display:block}.price{display:block;margin-top:4px}}</style></head><body><main class="wrap"><section class="top"><div class="brand"><div class="logo"></div><div><h1>کافه آکاتسوکی</h1><p>یک جرعه آرامش در دل شب</p></div><div class="status"><i></i> باز هستیم</div></div></section><div class="search"><span>⌕</span><input id="search" placeholder="دنبال چی می‌گردی؟"></div><div class="cats"><div class="catrow" id="cats"></div></div><div class="head"><div><p style="color:#e11d2e;font-size:10px;margin:0">منوی امروز</p><h2>انتخابت چیه؟</h2></div><p id="count"></p></div><section class="grid" id="grid"></section><a class="demo-link" href="admin-demo.html">مشاهده دموی پنل مدیریت ←</a></main><div class="backdrop" id="backdrop"></div><div class="sheet" id="sheet"><button class="close" id="close">×</button><div class="handle"></div><img id="sheetImg" alt=""><div class="body"><div id="sheetCat" style="font-size:9px;color:#e11d2e;font-weight:700"></div><h2 id="sheetName"></h2><div class="en" id="sheetEn"></div><p class="bigdesc" id="sheetDesc"></p><div class="tags" id="sheetTags"></div><div class="bottom"><strong id="sheetPrice"></strong><span id="sheetStock"></span></div></div></div><script>const items=[['اسپرسو','Espresso','قهوه گرم','عصاره غلیظ و متعادل از دانه‌های عربیکا و روبوستا.','۹۵,۰۰۰','https://images.unsplash.com/photo-1510707577719-ae7c14805e3a?auto=format&fit=crop&w=600&q=80',['پرفروش'],1],['آمریکانو','Americano','قهوه گرم','اسپرسو دوبل با آب داغ؛ تلخ، سبک و خوش‌عطر.','۱۱۰,۰۰۰','https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=600&q=80',['کلاسیک'],1],['کاپوچینو','Cappuccino','قهوه گرم','اسپرسو، شیر گرم و فوم مخملی با بافت متعادل.','۱۴۵,۰۰۰','https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=600&q=80',['پیشنهاد کافه'],1],['لاته','Caffè Latte','قهوه گرم','اسپرسو با شیر بخار داده‌شده؛ نرم و کرمی.','۱۵۵,۰۰۰','https://images.unsplash.com/photo-1561882468-9110e03e0f78?auto=format&fit=crop&w=600&q=80',['ملایم'],1],['موکا','Caffè Mocha','قهوه گرم','ترکیب اسپرسو، شکلات و شیر با طعمی شیرین و عمیق.','۱۷۵,۰۰۰','https://images.unsplash.com/photo-1578374173705-969cbe6f2d6b?auto=format&fit=crop&w=600&q=80',['جدید'],1],['آیس لاته','Iced Latte','قهوه سرد','اسپرسو دوبل، شیر سرد و یخ؛ ساده، خنک و دلچسب.','۱۶۵,۰۰۰','https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=600&q=80',['پرفروش'],1],['آیس آمریکانو','Iced Americano','قهوه سرد','اسپرسو دوبل، آب خنک و یخ برای یک انتخاب شفاف و تلخ.','۱۳۰,۰۰۰','https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=600&q=80',['بدون شکر'],1],['هات چاکلت','Hot Chocolate','نوشیدنی','شکلات گرم غلیظ با شیر و بافتی لطیف.','۱۵۰,۰۰۰','https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?auto=format&fit=crop&w=600&q=80',['محبوب'],1],['چای ماسالا','Masala Chai','چای و دمنوش','چای ادویه‌ای با دارچین، هل، زنجبیل و شیر.','۱۴۰,۰۰۰','https://images.unsplash.com/photo-1594631252845-29fc4cc8cde9?auto=format&fit=crop&w=600&q=80',['گرم و معطر'],1],['چیزکیک','Cheesecake','کیک و دسر','چیزکیک خامه‌ای با بیسکویت کره‌ای و سس توت.','۱۸۵,۰۰۰','https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=600&q=80',['پیشنهاد کافه'],1],['براونی','Brownie','کیک و دسر','براونی شکلات تلخ با بافت مرطوب و مغز گردو.','۱۴۵,۰۰۰','https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=600&q=80',['پرفروش'],0],['کروسان','Croissant','اسنک','کروسان کره‌ای تازه، لایه‌لایه و سبک.','۱۲۰,۰۰۰','https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=600&q=80',['تازه'],1]];const cats=['همه',...new Set(items.map(x=>x[2]))];let active='همه';const grid=document.getElementById('grid'),catsEl=document.getElementById('cats'),search=document.getElementById('search');function renderCats(){catsEl.innerHTML=cats.map(c=>`<button class="chip ${c===active?'active':''}" data-c="${c}">${c}</button>`).join('');catsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.c;renderCats();render()})}function render(){const q=search.value.trim();const arr=items.filter(x=>(active==='همه'||x[2]===active)&&(!q||x[0].includes(q)||x[1].toLowerCase().includes(q.toLowerCase())));document.getElementById('count').textContent=`${arr.length} آیتم`;grid.innerHTML=arr.map((x,i)=>`<article class="card ${x[7]?'':'off'}" data-name="${x[0]}"><div class="pic"><img loading="lazy" src="${x[5]}" alt="${x[0]}">${x[6][0]?`<span class="badge">${x[6][0]}</span>`:''}</div><div class="info"><div class="title"><div><h3>${x[0]}</h3><small>${x[1]}</small></div><div class="price">${x[4]}<br><span style="font-size:8px;color:#777">تومان</span></div></div><p class="desc">${x[3]}</p><div class="tags">${x[6].map(t=>`<span class="tag">${t}</span>`).join('')}</div>${x[7]?'':'<div style="color:#d88990;font-size:9px;margin-top:6px">فعلاً موجود نیست</div>'}</div></article>`).join('')||'<div style="grid-column:1/-1;text-align:center;padding:60px 10px;color:#888">چیزی با این اسم پیدا نکردیم.</div>';grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>openItem(items.find(x=>x[0]===c.dataset.name)))}function openItem(x){sheetImg.src=x[5];sheetCat.textContent=x[2];sheetName.textContent=x[0];sheetEn.textContent=x[1];sheetDesc.textContent=x[3];sheetPrice.textContent=x[4]+' تومان';sheetTags.innerHTML=x[6].map(t=>`<span class="tag">${t}</span>`).join('');sheetStock.textContent=x[7]?'موجود':'فعلاً موجود نیست';sheetStock.style.color=x[7]?'#9ed7af':'#d78c92';sheet.classList.add('open');backdrop.classList.add('open')}function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('open')}search.oninput=render;close.onclick=closeSheet;backdrop.onclick=closeSheet;renderCats();render();</script></body></html>
